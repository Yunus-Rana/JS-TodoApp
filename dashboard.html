<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h2>Todos</h2>
        <p id="whoami"></p>
      </div>
      <button id="logout">Log out</button>
    </div>

    <div class="add-box">
      <input type="text" id="newTodoInput" placeholder="Write a new todo..." />
      <button id="addTodoBtn">Add</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
